name: Project checks
on: [push, pull_request]

jobs:
  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest
      - name: API and browser suites
        shell: bash
        run: |
          export RESOLV_ATTACHMENTS="$RUNNER_TEMP/resolv-evidence"
          export RESOLV_DATABASE="$RUNNER_TEMP/resolv-core-api.db"
          python tests_e2e/e2e_api.py
          python tests_e2e/e2e_login_api.py
          python tests_e2e/e2e_enhancements_api.py
          python tests_e2e/e2e_recommendations_api.py
          python tests_e2e/e2e_followup_api.py
          export RESOLV_DATABASE="$RUNNER_TEMP/resolv-core-ui.db"
          python tests_e2e/e2e_ui.py
          python tests_e2e/e2e_enhancements_ui.py
          python tests_e2e/e2e_followup_ui.py
